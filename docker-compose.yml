version: '3.9'

services:

  # servicios de la app Django
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application #command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # monta el código en tiempo real
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis #se agrego e la paina 140
    environment: 
      - REDIS_URL=redis://redis:6379/1

  # Servicio de PostgreSQL
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf  # configuracion
    command: redis-server /usr/local/etc/redis/redis.conf 
    healthcheck: 
      test: ['CMD', 'redis-cli', 'ping'] 
      interval: 10s 
      timeout: 5s 
      retries: 5 

volumes:
  postgres_data:
  redis_data: